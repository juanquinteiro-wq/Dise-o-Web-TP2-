    <main>
      <h1>Elenco y Personajes</h1>

      <section class="seccion-1">
        <figure class="tarjeta-reparto">
          <h3>Elijah Wood — Frodo Bolsón</h3>
          <img src="../imagenes/frodo.jpg" alt="Frodo" />
          <p class="texto">
            Un joven hobbit elegido para llevar el Anillo Único hasta Mordor. Su
            valentía y resistencia son fundamentales para el destino de la
            Tierra Media.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/aragorn.jpg" alt="Aragorn" />
          <h3>Viggo Mortensen — Aragorn</h3>
          <p class="texto">
            Heredero del trono de Gondor y hábil guerrero. A lo largo de la
            trilogía debe aceptar su destino y convertirse en el líder que la
            Tierra Media necesita.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/gandalf.jpg" alt="Gandalf" />
          <h3>Ian McKellen — Gandalf</h3>
          <p class="texto">
            Un poderoso mago y uno de los principales líderes contra Sauron.
            Guía y protege a Frodo y a sus compañeros durante gran parte de su
            viaje.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/sam.jpg" alt="Sam" />
          <h3>Sean Astin — Samwise Gamgee</h3>
          <p class="texto">
            El mejor amigo y compañero de viaje de Frodo. Su lealtad y
            determinación lo convierten en una pieza esencial para completar la
            misión.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/golum.jpg" alt="Golum" />
          <h3>Andy Serkis — Gollum</h3>
          <p class="texto">
            Una criatura consumida durante años por el poder del Anillo. Su
            obsesión con recuperarlo lo convierte en una figura fundamental en
            el camino de Frodo hacia Mordor.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/legolas.jpg" alt="Legolas" />
          <h3>Orlando Bloom — Legolas</h3>
          <p class="texto">
            Un elfo arquero perteneciente al reino de Bosque Negro. Forma parte
            de la Comunidad y lucha junto a Aragorn y Gimli contra las fuerzas
            de Sauron.
          </p>
        </figure>

        <figure class="tarjeta-reparto">
          <img src="../imagenes/gimli_4a81.jpg" alt="Gimli" />
          <h3>John Rhys-Davies — Gimli</h3>
          <p class="texto">
            Un guerrero enano que integra la Comunidad del Anillo. Su fuerza,
            coraje y particular relación con Legolas aportan tanto acción como
            momentos de humor.
          </p>
        </figure>
      </section>
    </main>
